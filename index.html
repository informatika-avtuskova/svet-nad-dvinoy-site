*{box-sizing:border-box}
body{margin:auto;max-width:720px;padding:10px;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,"Segoe UI",Roboto,sans-serif}
h1{font:800 26px/1.1 Georgia,serif;margin:6px 0}h2{font-size:15px;margin:12px 0 6px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.box.active{box-shadow:0 0 0 2px var(--accent)}.box.event{border-left:6px solid var(--red)}
.alarm{border-color:var(--red)}.row{display:block;margin:6px 0}.row input[type=text],.row input:not([type]){margin-left:6px;padding:4px}
.track{display:flex;gap:2px;margin:6px 0}.track i{flex:1;min-width:0;height:16px;border-radius:2px;font:8px/16px system-ui;text-align:center;color:#000;font-style:normal;opacity:.55}
.track i.on{opacity:1;outline:2px solid var(--fg)}
.bar{height:14px;background:var(--line);border-radius:7px;overflow:hidden}.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--green))}
button{font:inherit;border:1px solid var(--accent);background:var(--card);color:var(--accent);border-radius:8px;padding:8px 10px;margin:3px 3px 0 0;cursor:pointer}
button.main{background:var(--accent);color:#fff}button:disabled{opacity:.4;cursor:default}
.chip{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 5px;margin:2px 2px 0 0}
.market{display:grid;grid-template-columns:1fr 1fr;gap:6px}.market .box{margin:0;font-size:13px}
.ban{background:#1f3a6b center/cover;border-radius:12px;padding:56px 12px 10px;margin-bottom:8px;text-align:center}
.ban h1{color:#fff;text-shadow:0 2px 10px #000;margin:0}
.eimg{width:100%;height:130px;object-fit:cover;border-radius:8px;margin-bottom:6px;display:block}
.cimg{width:100%;height:70px;object-fit:cover;border-radius:6px;margin-bottom:4px}
.dimg{float:right;width:64px;height:48px;object-fit:cover;border-radius:8px;margin-left:6px}
.log{font-size:12px;color:var(--muted);max-height:130px;overflow:auto}
[hidden]{display:none!important}
.seats{display:flex;gap:6px;margin-bottom:8px}.seat{flex:1;min-width:0;text-align:center;font-size:12px}
.seatimg{width:100%;height:60px;object-fit:cover;border-radius:8px;display:block}

'use strict';
/*
  «Свет над Двиной» — игровая логика (только правила).
  Интерфейс, сеть, роботы, обучение и чат сюда не входят.
  Всё состояние партии лежит в одном объекте `game`.
*/

// ---------- Константы ----------
const COINS = 0, ENERGY = 1, ECO = 2;      // индексы в player.resources = [М, Э, Эко]
const MAX_LOAD = 50;                       // нагрузка 50 = блэкаут, проиграли все
const IDEAL_LOAD = 10;                     // ниже — «идеальный баланс»
const YELLOW_ZONE = 25, RED_ZONE = 40;     // границы зон нагрузки
const TOTAL_MONTHS = 10;
const ACTIONS_PER_MONTH = 2;
const GOAL_BY_PLAYERS = { 2: 60, 3: 80, 4: 100 };   // цель по стабильности, %

// Рост нагрузки города по месяцам (только на сложных уровнях)
const CITY_GROWTH = {
  hard:   [1, 2, 3, 4, 6, 7, 8, 10, 11, 12],
  crisis: [1, 2, 4, 5, 6, 8, 9, 10, 12, 13],
};

// ---------- Данные: районы и карты модернизаций ----------
const DISTRICTS = {
  industrial:  { name: 'Промышленный', income: [5, 1, 0], start: [5, 2, 0], consumption: 3 },
  residential: { name: 'Жилой',        income: [3, 1, 1], start: [3, 1, 2], consumption: 2 },
  commercial:  { name: 'Коммерческий', income: [4, 1, 0], start: [6, 0, 0], consumption: 2 },
  suburb:      { name: 'Пригород',     income: [2, 2, 1], start: [2, 1, 2], consumption: 1 },
};

// copies — сколько экземпляров в колоде; coins/eco — цена; stability — прирост, %
// effects: consumptionCut — минус к потреблению района; frostProof — защита от «Заморозков»;
// incomeCoins / incomeEnergy / incomeEco — прибавка к месячному доходу;
// loadCutOnBuy — разовое снижение нагрузки при покупке; chpUpgrade — особая карта ТЭЦ.
// Тексты описаний (поле text) перенесите из исходного массива CD.
const CARDS = [
  { id: 'led',     name: 'Светодиодное освещение', copies: 2, coins: 3, eco: 0, stability: 10, effects: { consumptionCut: 1 } },
  { id: 'warm',    name: 'Утепление фасадов ЖК',   copies: 2, coins: 5, eco: 0, stability: 10, effects: { consumptionCut: 1, frostProof: 1 } },
  { id: 'meter',   name: 'Умные счётчики',         copies: 2, coins: 4, eco: 1, stability: 10, effects: { incomeCoins: 2 } },
  { id: 'sun',     name: 'Солнечные панели',       copies: 2, coins: 6, eco: 0, stability: 20, effects: { incomeEnergy: 2, solar: 1 } },
  { id: 'wind',    name: 'Ветрогенератор',         copies: 1, coins: 7, eco: 0, stability: 20, effects: { incomeEnergy: 2, wind: 1 } },
  { id: 'mach',    name: 'Энергоэфф. станки',      copies: 1, coins: 5, eco: 0, stability: 10, effects: { consumptionCut: 1 } },
  { id: 'pump',    name: 'Тепловой насос',         copies: 1, coins: 5, eco: 1, stability: 10, effects: { consumptionCut: 1, frostProof: 1 } },
  { id: 'bike',    name: 'Велодорожки',            copies: 1, coins: 2, eco: 1, stability: 10, effects: { incomeEco: 1 } },
  { id: 'roof',    name: 'Зелёная крыша',          copies: 2, coins: 3, eco: 0, stability: 10, effects: { incomeEco: 1 } },
  { id: 'store',   name: 'Накопитель энергии',     copies: 1, coins: 6, eco: 0, stability: 10, effects: {} },  // смягчает удар события, см. applyEventLoad
  { id: 'grid',    name: 'Умная сеть',             copies: 1, coins: 8, eco: 2, stability: 30, effects: {} },  // −1 к нагрузке в месяц, защита от Грозы
  { id: 'sens',    name: 'Датчики движения',       copies: 1, coins: 2, eco: 0, stability: 10, effects: { loadCutOnBuy: 1 } },
  { id: 'patrol',  name: 'Школьный энергопатруль', copies: 2, coins: 1, eco: 1, stability: 10, effects: { loadCutOnBuy: 2 } },
  { id: 'bio',     name: 'Биогазовая установка',   copies: 1, coins: 6, eco: 0, stability: 20, effects: { incomeEnergy: 1, incomeEco: 1 } },
  { id: 'rec',     name: 'Рекуперация тепла',      copies: 1, coins: 6, eco: 0, stability: 20, effects: { consumptionCut: 2 } },
  { id: 'tec',     name: 'Модернизация ТЭЦ',       copies: 1, coins: 8, eco: 0, stability: 20, effects: { incomeEnergy: 3, chpUpgrade: 1 } },
  { id: 'ebus',    name: 'Электробусы',            copies: 1, coins: 6, eco: 1, stability: 20, effects: { incomeEco: 1 } },
  { id: 'light',   name: 'Умные светофоры',        copies: 1, coins: 3, eco: 0, stability: 10, effects: { consumptionCut: 1 } },
];

// ---------- Состояние и вспомогательные функции ----------
let game = null;

const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

function shuffle(items) {                       // перемешивание Фишера — Йетса
  const result = [...items];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

const isHardMode      = () => game.difficulty === 'hard' || game.difficulty === 'crisis';
const currentPlayer   = () => game.players[game.currentIndex];
const findPlayer      = district => game.players.find(p => p.district === district);
const hasCard         = (player, id) => player.cards.some(c => c.id === id);
const anyoneHasCard   = id => game.players.some(p => hasCard(p, id));
const teamCoins       = () => game.players.reduce((sum, p) => sum + p.resources[COINS], 0);
const isFrostProof    = player => player.cards.some(c => c.effects.frostProof);
const unprotectedCount = () => game.players.filter(p => !isFrostProof(p)).length;

function log(text) {
  game.log.unshift(text);
  game.log.length = Math.min(game.log.length, 40);   // храним последние 40 записей
  game.logCount++;                                   // клиент по сети показывает новые записи
}

function setLoad(value) {
  const old = game.load;
  game.load = clamp(value, 0, MAX_LOAD);
  game.loadDelta += game.load - old;                 // для анимации «+3» в интерфейсе
  game.peakLoad = Math.max(game.peakLoad, game.load);
  if (game.load >= MAX_LOAD && !game.result) game.result = 'lose';
}

function changeStability(delta) {
  game.stability = clamp(game.stability + delta, 0, 100);
}

// Командная оплата: монеты берём по одной у самого богатого игрока
function payFromTeam(amount) {
  for (; amount > 0; amount--) {
    const richest = [...game.players].sort((a, b) => b.resources[COINS] - a.resources[COINS])[0];
    if (richest.resources[COINS] < 1) return false;
    richest.resources[COINS]--;
  }
  return true;
}

function refillMarket() {
  while (game.market.length < 4) {
    if (game.cardDeck.length === 0) {                // колода кончилась — тасуем сброс
      game.cardDeck = shuffle(game.discard);
      game.discard = [];
      if (game.cardDeck.length === 0) break;
    }
    game.market.push(game.cardDeck.pop());
  }
}

// ---------- События месяца ----------
// apply() меняет ресурсы напрямую, а прирост нагрузки и изменение стабильности возвращает.
// frost — событие про «Заморозки», hard — «сложное» (убирается на лёгком уровне).
const EVENTS = [
  { id: 'heat', name: 'Аномальная жара', apply() {
      game.flags.solarBonus = true;
      return { load: 3, stability: game.load >= RED_ZONE ? -10 : 0 };
  } },
  { id: 'frost', name: 'Лютые морозы', frost: true, apply() {
      const unprotected = unprotectedCount();
      return { load: 2 * unprotected, stability: unprotected >= 2 ? -10 : 0 };
  } },
  { id: 'snow', name: 'Снегопад', frost: true, apply: () => ({ load: unprotectedCount() }) },
  { id: 'heating', name: 'Отопительный сезон', frost: true, apply() {
      const protectedCount = game.players.length - unprotectedCount();
      return { load: protectedCount >= 2 ? 1 : 3 };
  } },
  { id: 'ev', name: 'Марафон электромобилей', apply() {
      const residential = findPlayer('residential');
      if (!residential) return { load: 1 };
      return { load: hasCard(residential, 'meter') ? 0 : 2 };
  } },
  { id: 'cloud', name: 'Пасмурный месяц', apply() { game.flags.cloudy = true; } },
  { id: 'sunny', name: 'Солнечный месяц', apply() {
      game.flags.solarDouble = true;
      game.players.forEach(p => p.resources[ECO]++);
  } },
  { id: 'still', name: 'Штиль', apply() { game.flags.noWind = true; return { load: 1 }; } },
  { id: 'earth', name: 'День Земли', apply() { game.flags.earthDay = true; } },
  { id: 'tecacc', name: 'Авария на старой ТЭЦ', apply() {
      if (anyoneHasCard('tec')) { log('ТЭЦ модернизирована — авария отменена.'); return; }
      game.players.forEach(p => { p.resources[ENERGY] = Math.max(0, p.resources[ENERGY] - 2); });
      return { load: 2, stability: -10 };
  } },
  { id: 'factory', name: 'Новый завод', apply() {
      const industrial = findPlayer('industrial');
      if (industrial) industrial.resources[COINS] += 2;
      return { load: 3, stability: game.load + 3 >= YELLOW_ZONE ? -10 : 0 };
  } },
  { id: 'grant', name: 'Грант министерства', apply() {
      game.players.forEach(p => { p.resources[COINS] += 3; });
  } },
  { id: 'fest', name: 'Экологический фестиваль', apply() {
      game.flags.festival = true;                    // первая Эко-акция месяца снижает нагрузку на 3
      game.players.forEach(p => p.resources[ECO]++);
  } },
  { id: 'bf', name: 'Чёрная пятница', apply() {
      const commercial = findPlayer('commercial');
      if (!commercial) return { load: 1 };
      commercial.resources[COINS] += 3;
      return { load: 2 };
  } },
  { id: 'jam', name: 'Пробки', apply() {
      if (anyoneHasCard('ebus')) { log('Электробусы отменили пробки.'); return; }
      return { load: 2 };
  } },
  { id: 'invest', name: 'Инвестор', apply() {
      game.players.forEach(p => { p.investorDiscount = true; });   // скидка 2 М на первую покупку
  } },
  { id: 'cable', name: 'Кража кабеля', apply: () => ({ load: 2, stability: -10 }) },
  { id: 'calm', name: 'Спокойный месяц', apply() {} },
  { id: 'storm', name: 'Гроза', apply() {
      if (anyoneHasCard('store') || anyoneHasCard('grid')) { log('Защита сработала — гроза не страшна.'); return; }
      return { load: 2, stability: -10 };
  } },
  { id: 'repair', name: 'Ремонт сетей', apply() { game.flags.repair = 'offered'; } },
  { id: 'ice', name: 'Ледяной дождь', frost: true, hard: true, apply() {
      const unprotected = unprotectedCount();
      return { load: 2 * unprotected, stability: unprotected >= 3 ? -20 : -10 };
  } },
  { id: 'flood', name: 'Паводок на Западной Двине', hard: true, apply() {
      game.players.forEach(p => { p.resources[ENERGY] = Math.max(0, p.resources[ENERGY] - 1); });
      game.flags.flood = 'offered';                  // если команда не заплатит 4 М — стабильность −10%
      return { load: 2 };
  } },
  { id: 'chain', name: 'Цепная авария', hard: true, apply() {
      const withoutCards = game.players.filter(p => p.cards.length === 0).length;
      return { load: 2, stability: -10 * withoutCards };
  } },
  { id: 'peak', name: 'Пиковый вечер', hard: true, apply() { game.flags.peak = true; return { stability: -10 }; } },
  { id: 'audit', name: 'Проверка энергонадзора', hard: true, apply() {
      let stability = 0;
      for (const p of game.players) {
        if (p.cards.length >= 2) continue;
        if (p.resources[COINS] >= 2) p.resources[COINS] -= 2;
        else stability -= 10;                        // платить нечем — штраф стабильности
      }
      return { stability };
  } },
  { id: 'cyber', name: 'Кибератака на Умную сеть', hard: true, apply() {
      game.flags.cyber = true;                       // «Накопитель» и «Умная сеть» отключены
      return anyoneHasCard('grid') ? { load: 2, stability: -10 } : { load: 1 };
  } },
  { id: 'hot', name: 'Перегрев трансформатора', hard: true, apply() {
      if (game.load < YELLOW_ZONE) return { load: 1 };
      return { load: 3, stability: anyoneHasCard('store') ? -10 : -20 };
  } },
];

function eventsForDifficulty(difficulty) {
  return EVENTS.filter(event => {
    if (difficulty === 'easy' && (event.hard || event.id === 'storm' || event.id === 'cable')) return false;
    const hardMode = difficulty === 'hard' || difficulty === 'crisis';
    if (hardMode && ['calm', 'grant', 'invest'].includes(event.id)) return false;
    return true;
  });
}

// Прирост нагрузки от события с поправками на сложность и «Накопитель»
function applyEventLoad(load) {
  if (load <= 0) return 0;
  if (game.difficulty === 'crisis') load += 2;
  else if (game.difficulty === 'hard') load += 1;
  if (anyoneHasCard('store') && !game.flags.cyber) {
    load = Math.max(0, load - 2);
    log('Накопитель смягчил удар (−2).');
  }
  return load;
}

// ---------- Начало партии и месяца ----------
// seats: [{ district, name, bot?, pid? }], options: { difficulty, tutorial, botLevel }
function startGame(seats, { difficulty = 'normal', tutorial = false, botLevel = 'normal' } = {}) {
  const count = seats.length;
  const cardDeck = CARDS.flatMap(card => Array.from({ length: card.copies }, () => ({ ...card })));
  const startLoad = (count === 2 ? 5 : 8) + ({ hard: 3, crisis: 5 }[difficulty] || 0);

  game = {
    difficulty, tutorial, botLevel,
    players: seats.map(seat => ({
      district: seat.district, name: seat.name, bot: !!seat.bot, pid: seat.pid || null,
      resources: [...DISTRICTS[seat.district].start],
      cards: [], actionsLeft: ACTIONS_PER_MONTH,
      investorDiscount: false, skippedForEarthDay: false,
    })),
    load: startLoad, stability: 0, month: 1, goal: GOAL_BY_PLAYERS[count],
    currentIndex: 0,
    cardDeck: shuffle(cardDeck), discard: [], market: [],
    eventDeck: shuffle(eventsForDifficulty(difficulty)),
    currentEvent: null,
    flags: {},               // эффекты текущего месяца: cloudy, noWind, peak, cyber, repair, flood…
    mode: null,              // 'help' или 'swap' — многошаговые действия
    result: null,            // null | 'win' | 'draw' | 'lose'
    log: [], logCount: 0, loadDelta: 0,
    peakLoad: 0, soldEnergy: 0, ecoActions: 0, zoneMonths: [0, 0, 0],   // статистика для разбора партии
  };
  refillMarket();
  startMonth();
}

function startMonth() {
  game.flags = {};
  game.players.forEach(p => { p.actionsLeft = ACTIONS_PER_MONTH; p.investorDiscount = false; p.skippedForEarthDay = false; });
  game.currentIndex = 0;
  game.mode = null;
  game.ecoActionUsedThisMonth = false;

  const event = game.eventDeck.pop();
  game.currentEvent = event;
  log(`— Месяц ${game.month}: «${event.name}»`);

  const { load = 0, stability = 0 } = event.apply() || {};
  setLoad(game.load + applyEventLoad(load));
  if (stability) changeStability(stability);

  payIncome();
  applyConsumption();
}

// ---------- Доход и потребление ----------
// Штраф к доходу монет в жёлтой/красной зоне (зависит от сложности)
function incomePenalty() {
  const inRed    = game.load >= RED_ZONE;
  const inYellow = game.load >= YELLOW_ZONE && !inRed;
  let penalty = inRed ? 1 : 0;
  if (inRed && game.difficulty === 'crisis') penalty++;
  if (inYellow && isHardMode()) penalty++;
  return penalty;
}

function payIncome() {
  const { flags } = game;
  const penalty = incomePenalty();

  for (const player of game.players) {
    let [coins, energy, eco] = DISTRICTS[player.district].income;
    let chpEcoLoss = 0;

    for (const { effects } of player.cards) {
      let cardEnergy = effects.incomeEnergy || 0;
      if (effects.solar) {                           // погода влияет на солнечные панели
        if (flags.cloudy) cardEnergy = 0;
        else {
          if (flags.solarDouble) cardEnergy *= 2;
          if (flags.solarBonus) cardEnergy += 1;
        }
      }
      if (effects.wind && flags.noWind) cardEnergy = 0;
      if (cardEnergy > 0 && player.district === 'suburb') cardEnergy++;   // особенность Пригорода

      energy += cardEnergy;
      coins  += effects.incomeCoins || 0;
      eco    += effects.incomeEco || 0;
      if (effects.chpUpgrade) chpEcoLoss++;          // ТЭЦ даёт энергию, но стоит 1 Эко в месяц
    }

    coins = Math.max(0, coins - penalty);
    player.resources[COINS] += coins;
    player.resources[ENERGY] += energy;
    player.resources[ECO] = Math.max(0, player.resources[ECO] + eco - chpEcoLoss);
    log(`${player.name}: доход +${coins}М +${energy}Э +${eco - chpEcoLoss}Эко`);
  }
}

function playerConsumption(player) {
  let consumption = DISTRICTS[player.district].consumption * (game.flags.peak ? 2 : 1);
  for (const { id, effects } of player.cards) {
    // «Энергоэфф. станки» в Промышленном районе снижают потребление на 2, а не на 1
    consumption -= (id === 'mach' && player.district === 'industrial') ? 2 : (effects.consumptionCut || 0);
  }
  return Math.max(0, consumption);
}

function cityGrowth() {
  return (CITY_GROWTH[game.difficulty] || [])[game.month - 1] || 0;
}

function applyConsumption() {
  const smartGridBonus = anyoneHasCard('grid') && !game.flags.cyber ? 1 : 0;
  const growth = cityGrowth();
  const total = game.players.reduce((sum, p) => sum + playerConsumption(p), 0) - smartGridBonus + growth;
  setLoad(game.load + total);
  log(`Потребление: Нагрузка ${total >= 0 ? '+' : ''}${total}${growth ? ` (рост города +${growth})` : ''} → ${game.load}`);
}

// ---------- Действия игрока ----------
function cardCost(player, card) {
  let cost = card.coins;
  if (game.difficulty === 'crisis') cost += 1;
  if (game.load >= YELLOW_ZONE && game.load < RED_ZONE) cost += 1;     // в жёлтой зоне карты дороже
  if (player.district === 'industrial' && (card.id === 'mach' || card.id === 'rec')) cost -= 1;
  if (player.investorDiscount) cost -= 2;
  return Math.max(0, cost);
}

function buyCard(marketIndex) {
  const player = currentPlayer(), card = game.market[marketIndex];
  const cost = cardCost(player, card);
  if (player.actionsLeft < 1 || player.resources[COINS] < cost || player.resources[ECO] < card.eco) return;

  player.resources[COINS] -= cost;
  player.resources[ECO] -= card.eco;
  player.actionsLeft--;
  player.investorDiscount = false;                   // скидка — только на первую покупку
  game.market.splice(marketIndex, 1);
  player.cards.push(card);
  changeStability(card.stability);
  if (card.effects.loadCutOnBuy) setLoad(game.load - card.effects.loadCutOnBuy);
  log(`${player.name} купил «${card.name}»`);
}

// Отдать энергию городу: каждая единица снижает нагрузку на 1
function sellEnergy(all) {
  const player = currentPlayer();
  const amount = all ? player.resources[ENERGY] : 1;
  if (player.actionsLeft < 1 || amount < 1 || player.resources[ENERGY] < amount) return;

  player.resources[ENERGY] -= amount;
  game.soldEnergy += amount;
  setLoad(game.load - amount);
  player.actionsLeft--;
  log(`${player.name} подал ${amount} Э: Нагрузка ${game.load}`);
}

function ecoAction() {
  const player = currentPlayer();
  const cost = player.district === 'residential' ? 1 : 2;
  if (player.actionsLeft < 1 || player.resources[ECO] < cost) return;

  player.resources[ECO] -= cost;
  const loadCut = game.flags.festival && !game.ecoActionUsedThisMonth ? 3 : 2;
  game.ecoActionUsedThisMonth = true;
  game.ecoActions++;
  setLoad(game.load - loadCut);
  player.actionsLeft--;
  log(`${player.name}: Эко-акция −${loadCut}`);
}

function sideJob() {
  const player = currentPlayer();
  if (player.actionsLeft < 1) return;
  player.resources[COINS] += 2;
  player.actionsLeft--;
  log(`${player.name}: подработка +2М`);
}

function refreshMarket() {
  const player = currentPlayer();
  if (player.actionsLeft < 1 || player.resources[COINS] < 1) return;
  player.resources[COINS]--;
  game.discard.push(...game.market);
  game.market = [];
  refillMarket();
  player.actionsLeft--;
  log('Рынок обновлён');
}

// «Помочь соседу» и «Биржа» — режимы из нескольких шагов; действие тратится при выходе из режима
function startMode(mode) {
  if (currentPlayer().actionsLeft < 1) return;
  game.mode = mode;                                  // 'help' | 'swap'
  game.modeUsed = false;
}

function giveResource(toIndex, resourceIndex) {
  const player = currentPlayer();
  const validRecipient = game.players[toIndex] && toIndex !== game.currentIndex;   // защита от неверных запросов по сети
  if (!validRecipient || !(player.resources[resourceIndex] >= 1)) return;
  player.resources[resourceIndex]--;
  game.players[toIndex].resources[resourceIndex]++;
  game.modeUsed = true;
}

function exchangeResources(giveIndex, getIndex) {
  const player = currentPlayer();
  const rate = player.district === 'commercial' ? 1 : 2;   // Коммерческий меняет 1 к 1, остальные 2 к 1
  if (giveIndex === getIndex || !(player.resources[giveIndex] >= rate) || !(getIndex in player.resources)) return;
  player.resources[giveIndex] -= rate;
  player.resources[getIndex]++;
  game.modeUsed = true;
}

function finishMode() {
  if (game.modeUsed) currentPlayer().actionsLeft--;
  game.mode = null;
}

// День Земли: отказаться от действия ради +2 Эко и −1 к нагрузке
function skipActionForEarthDay() {
  const player = currentPlayer();
  if (!game.flags.earthDay || player.actionsLeft < 1 || player.skippedForEarthDay) return;
  player.actionsLeft--;
  player.skippedForEarthDay = true;
  player.resources[ECO] += 2;
  setLoad(game.load - 1);
  log(`${player.name} отказался от действия: +2 Эко, Нагрузка −1`);
}

// Командные решения по событиям (платит вся команда)
function payForRepair() {
  if (game.flags.repair !== 'offered' || teamCoins() < 4) return;
  payFromTeam(4);
  game.flags.repair = 'done';
  changeStability(10);
  setLoad(game.load - 2);
  log('Ремонт сетей выполнен');
}

function resolveFlood(pay) {
  if (game.flags.flood !== 'offered') return;
  if (pay && teamCoins() >= 4) {
    payFromTeam(4);
    log('Паводок: подстанция отремонтирована');
  } else {
    changeStability(-10);
    log('Паводок: Стабильность −10%');
  }
  game.flags.flood = 'resolved';
}

// ---------- Конец хода и месяца ----------
function endTurn() {
  game.mode = null;
  const isLastPlayer = game.currentIndex === game.players.length - 1;
  if (!isLastPlayer) { game.currentIndex++; return; }

  // Дальше — итоги месяца
  if (game.flags.flood === 'offered') {
    changeStability(-10);
    log('Паводок: ремонт не оплачен, Стабильность −10%');
  }
  if (!game.result) {
    const zone = game.load < YELLOW_ZONE ? 0 : game.load < RED_ZONE ? 1 : 2;   // зелёная / жёлтая / красная
    game.zoneMonths[zone]++;
    const change = game.load < IDEAL_LOAD ? 10 : game.load < YELLOW_ZONE ? 0 : game.load < RED_ZONE ? -10 : -20;
    changeStability(change);
    log(`Итог месяца: стабильность ${change > 0 ? '+' : ''}${change}%`);
  }
  if (game.result) return;                           // блэкаут уже случился

  if (game.month === TOTAL_MONTHS) {
    game.result = game.stability >= game.goal ? 'win' : 'draw';
    return;
  }
  game.month++;
  refillMarket();
  startMonth();
}

if (typeof module !== 'undefined') {
  module.exports = {
    startGame, buyCard, sellEnergy, ecoAction, sideJob, refreshMarket, endTurn,
    skipActionForEarthDay, payForRepair, resolveFlood, getGame: () => game,
  };
}

</script>
<script>
// ---------- Интерфейс (режим «на одном устройстве») ----------
const app = document.getElementById('app');
const RESOURCE_LABELS = ['🪙 М', '⚡ Э', '🌿 Эко'];
const DIFFICULTIES = { easy: 'лёгкая', normal: 'обычная', hard: 'сложная', crisis: 'кризис' };
const setup = { districts: ['industrial', 'residential'], names: {}, bots: {}, difficulty: 'normal', botLevel: 'normal', tutorial: false };
const BOT_LEVELS = { easy: 'новичок', normal: 'обычные', hard: 'эксперты' };
const D = GAME_DATA;
const img = (path, cls) => path ? `<img class="${cls}" src="${path}" alt="" loading="lazy" onerror="this.remove()">` : '';

// Имена игроков попадают в innerHTML — экранируем
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const zoneColor = load => load < YELLOW_ZONE ? '#3fa34d' : load < RED_ZONE ? '#f2c744' : '#d64545';

function renderMenu() {
  const rows = Object.keys(DISTRICTS).map(id => {
    const on = setup.districts.includes(id);
    return `<label class="row"><input type="checkbox" ${on ? 'checked' : ''} onchange="toggleDistrict('${id}')">
      ${DISTRICTS[id].name}
      ${on ? `<label><input type="checkbox" ${setup.bots[id] ? 'checked' : ''} onchange="setup.bots['${id}']=this.checked;renderMenu()"> 🤖</label>` : ''}
      ${on && !setup.bots[id] ? `<input placeholder="Имя игрока" maxlength="16" value="${esc(setup.names[id] || '')}"
        oninput="setup.names['${id}']=this.value">` : ''}</label>`;
  }).join('');
  const options = Object.entries(DIFFICULTIES).map(([key, label]) =>
    `<option value="${key}" ${setup.difficulty === key ? 'selected' : ''}>${label}</option>`).join('');
  app.innerHTML = `${banner()}
    <div class="box">Выберите районы (2–4) и передавайте устройство по очереди.${rows}
    Сложность: <select onchange="setup.difficulty=this.value">${options}</select><br>
    Роботы: <select onchange="setup.botLevel=this.value">${Object.entries(BOT_LEVELS).map(([k, v]) =>
      `<option value="${k}" ${setup.botLevel === k ? 'selected' : ''}>${v}</option>`).join('')}</select><br>
    <label><input type="checkbox" ${setup.tutorial ? 'checked' : ''} onchange="setup.tutorial=this.checked"> 🎓 Обучающий режим (подсказки и разбор партии)</label><br>
    <button class="main" ${setup.districts.length < 2 ? 'disabled' : ''} onclick="startLocalGame()">Начать игру</button></div>${networkBox()}`;
}

function toggleDistrict(id) {
  const list = setup.districts;
  if (list.includes(id)) list.splice(list.indexOf(id), 1);
  else if (list.length < 4) list.push(id);
  renderMenu();
}

function startLocalGame() {
  const order = Object.keys(DISTRICTS).filter(id => setup.districts.includes(id));
  const seats = order.map((district, i) => setup.bots[district]
    ? { district, bot: true, name: '🤖 ' + DISTRICTS[district].name }
    : { district, name: setup.names[district]?.trim() || `Игрок ${i + 1}` });
  startGame(seats, { difficulty: setup.difficulty, botLevel: setup.botLevel, tutorial: setup.tutorial });
  render();
}


const banner = (title = 'Свет над Двиной') => `<div class="ban" style="background-image:url(${D.IMG.banner})"><h1>${title}</h1></div>`;

function render() {
  clearTimeout(botTimer);
  if (net.role === 'host') sendAll(stateMessage());   // клиенты видят то же состояние
  if (game.result) return renderEnd();
  const player = currentPlayer(), { flags } = game;
  const track = Array.from({ length: MAX_LOAD + 1 }, (_, i) =>
    `<i class="${i === game.load ? 'on' : ''}" style="background:${zoneColor(i)}">${i % 5 === 0 ? i : ''}</i>`).join('');
  const my = isMyTurn(player), canDecide = net.role === 'local' || !!net.me;
  const canAct = my && player.actionsLeft > 0, energy = player.resources[ENERGY];
  const ecoCost = player.district === 'residential' ? 1 : 2;

  const players = game.players.map((p, i) => `<div class="box ${i === game.currentIndex ? 'active' : ''}">
    ${img(D.IMG.districts[p.district], 'dimg')}<b>${esc(p.name)} · ${DISTRICTS[p.district].name}</b>
    ${i === game.currentIndex ? ` · действий: ${p.actionsLeft}` : ''}<br>
    ${p.resources.map((v, r) => `${RESOURCE_LABELS[r]} ${v}`).join(' &nbsp; ')}<br>
    <small>Потребляет +${playerConsumption(p)}/мес</small><br>
    ${p.cards.map(c => `<span class="chip" title="${esc(D.CARD_TEXT[c.id])}">${D.CARD_ICON[c.id] || ''} ${c.name}</span>`).join('')}</div>`).join('');

  const market = game.market.map((card, i) => {
    const cost = cardCost(player, card);
    const affordable = canAct && player.resources[COINS] >= cost && player.resources[ECO] >= card.eco;
    return `<div class="box">${img(D.IMG.cards[card.id], 'cimg')}<b>${card.name}</b><br>${D.CARD_TEXT[card.id]}<br>${cost} М${card.eco ? ` + ${card.eco} Эко` : ''} · ★ +${card.stability}%<br>
      <button ${affordable ? '' : 'disabled'} onclick="act(buyCard,${i})">Купить</button></div>`;
  }).join('');

  app.innerHTML = `${banner()}
  <div class="box ${game.load >= RED_ZONE ? 'alarm' : ''}">
    📅 Месяц ${game.month}/${TOTAL_MONTHS} · <b>⚡ Нагрузка ${game.load}/${MAX_LOAD}</b>
    <div class="track">${track}</div>
    ⭐ Стабильность ${game.stability}% (цель ${game.goal}%)
    <div class="bar"><b style="width:${game.stability}%"></b></div></div>
  <div class="box event">${img(D.IMG.events[game.currentEvent.id], 'eimg')}<b>${D.EVENT_ICON[game.currentEvent.id] || ''} Событие: ${game.currentEvent.name}</b>${game.currentEvent.hard ? ' · СЛОЖНОЕ' : ''}<br>${D.EVENT_TEXT[game.currentEvent.id]}
    ${flags.repair === 'offered' ? `<br><button ${teamCoins() < 4 || !canDecide ? 'disabled' : ''} onclick="act(payForRepair)">Ремонт сетей: заплатить 4 М вместе</button>` : ''}
    ${flags.flood === 'offered' ? `<br><button ${teamCoins() < 4 || !canDecide ? 'disabled' : ''} onclick="act(resolveFlood,true)">Паводок: заплатить 4 М вместе</button>
      <button ${canDecide ? '' : 'disabled'} onclick="act(resolveFlood,false)">Не платить (−10%)</button>` : ''}</div>
  ${players}
  ${game.tutorial && my ? tutorialBox(player) : ''}
  <h2>Ход: ${esc(player.name)}${net.role === 'local' ? (player.bot ? ' — думает…' : '') : my ? ' — ваш ход!' : player.bot ? ' — думает…' : ' — ждите'}</h2>
  ${net.role === 'local' ? '' : `<small>Вы: ${net.me ? DISTRICTS[net.me].name : 'наблюдатель'}</small>`}<div class="box">${game.mode ? modeBox(player) : `
    <button ${canAct && energy ? '' : 'disabled'} onclick="act(sellEnergy,true)">⚡ Подать всю энергию (${energy})</button>
    <button ${canAct && energy ? '' : 'disabled'} onclick="act(sellEnergy,false)">⚡ Подать 1 Э</button>
    <button ${canAct && player.resources[ECO] >= ecoCost ? '' : 'disabled'} onclick="act(ecoAction)">🌿 Эко-акция (${ecoCost} Эко)</button>
    <button ${canAct ? '' : 'disabled'} onclick="act(sideJob)">💼 Подработка +2 М</button>
    <button ${canAct ? '' : 'disabled'} onclick="act(startMode,'help')">🤝 Помочь соседу</button>
    <button ${canAct ? '' : 'disabled'} onclick="act(startMode,'swap')">🔄 Биржа</button>
    <button ${canAct && player.resources[COINS] ? '' : 'disabled'} onclick="act(refreshMarket)">🔃 Обновить рынок (1 М)</button>
    ${flags.earthDay && canAct && !player.skippedForEarthDay ? '<button onclick="act(skipActionForEarthDay)">🌍 День Земли: пропустить действие</button>' : ''}<br>
    <button class="main" ${my ? '' : 'disabled'} onclick="act(endTurn)">${game.currentIndex < game.players.length - 1 ? 'Закончить ход' : game.month === TOTAL_MONTHS ? 'Завершить игру' : 'Следующий месяц'}</button>`}</div>
  <h2>Рынок модернизаций</h2><div class="market">${market}</div>
  <h2>Журнал</h2><div class="box log">${game.log.map(esc).join('<br>')}</div>`;
  if (player.bot && net.role !== 'client') botTimer = setTimeout(() => { botStep(); render(); }, 900);
}

// Экран многошаговых действий «Помочь соседу» / «Биржа»

// До трёх подсказок для текущего игрока
function tutorialHint(player) {
  if (player.actionsLeft < 1) return 'Действия закончились — нажмите «Закончить ход».';
  const [, energy, eco] = player.resources;
  const ecoCostNow = player.district === 'residential' ? 1 : 2;
  const tips = [];

  if (game.load >= RED_ZONE) tips.push('🔴 Красная зона: доход меньше, в конце месяца стабильность −20%. Срочно снижайте нагрузку: подайте энергию (1 Э = −1) или сделайте эко-акцию (−2).');
  else if (game.load >= YELLOW_ZONE) tips.push('🟡 Жёлтая зона: карты дороже на 1 М, в конце месяца стабильность −10%. Верните нагрузку ниже 25.');
  else if (game.load < IDEAL_LOAD) tips.push('🟢 Идеальный баланс: в конце месяца стабильность +10%.');
  else tips.push('🟢 Зелёная зона: стабильность не растёт. Опуститесь ниже 10 — и получите +10% каждый месяц.');

  if (energy > 0 && game.load >= IDEAL_LOAD) tips.push(`У вас ${energy} Э: подайте в сеть — нагрузка снизится на столько же.`);
  else if (eco >= ecoCostNow && game.load >= 15) tips.push('Эко-очки можно потратить на эко-акцию: нагрузка −2.');

  const affordable = game.market.filter(card => player.resources[COINS] >= cardCost(player, card) && eco >= card.eco)
    .sort((a, b) => b.stability - a.stability);
  if (affordable.length) {
    const best = affordable[0];
    tips.push(`Можно купить «${best.name}» за ${cardCost(player, best)} М: +${best.stability}% стабильности. ${D.CARD_TEXT[best.id]}.`);
  } else if (player.resources[COINS] < 3) tips.push('Монет мало: «Подработка» даёт +2 М.');

  if (EVENT_TIPS[game.currentEvent.id]) tips.push('Событие: ' + EVENT_TIPS[game.currentEvent.id]);
  if (game.month === 1 && !player.cards.length) tips.push('Совет: начните с дешёвых карт («Светодиоды», «Зелёная крыша») — они дают стабильность и экономят нагрузку.');
  return tips.slice(0, 3).join('<br>');
}

const tutorialBox = player => `<div class="box" style="border-left:6px solid var(--yellow)">🎓 <b>Подсказка</b><br>${tutorialHint(player)}</div>`;

// Разбор партии на экране итогов
function partyReview() {
  const [green, yellow, red] = game.zoneMonths;
  const cards = game.players.reduce((sum, p) => sum + p.cards.length, 0);
  const tips = [];
  if (red) tips.push('Красная зона стоила дорого: −20% стабильности и −1 М дохода каждый месяц. Снижать нагрузку заранее дешевле, чем догонять.');
  if (yellow + red >= 3) tips.push('Нагрузка часто уходила выше 25: карты дорожали, стабильность падала. Подавайте энергию и делайте эко-акции раньше.');
  if (!yellow && !red) tips.push('Нагрузка держалась в зелёной зоне — именно так растёт стабильность.');
  if (game.soldEnergy < 5) tips.push('Энергии подано мало: каждый Э снижает нагрузку на 1.');
  if (cards < game.players.length * 2) tips.push('Мало модернизаций: они дают и стабильность, и постоянное снижение потребления.');

  return `<hr><b>📊 Разбор партии</b><br>Месяцев в зелёной / жёлтой / красной зоне: ${green} / ${yellow} / ${red}<br>
    Пиковая нагрузка: ${game.peakLoad} · энергии подано: ${game.soldEnergy} · эко-акций: ${game.ecoActions} · карт куплено: ${cards}
    <ul>${tips.map(t => `<li>${t}</li>`).join('')}</ul>
    ${game.tutorial ? '<b>Обсудите:</b> какие решения экономили больше всего энергии? Что дешевле — строить новые станции или экономить? Как в реальном городе работает «пиковая нагрузка»?' : ''}`;
}

// ---------- Роботы ----------
let botTimer = 0;

// Оценка карты для робота: чем выше, тем охотнее покупает
function botCardScore(card, cost, expert) {
  const e = card.effects;
  return (card.stability / 10) * (expert ? 14 : 10) + (e.consumptionCut || 0) * (expert ? 9 : 6)
    + (e.loadCutOnBuy || 0) * 4 + (e.incomeEnergy || 0) * 4 + (e.incomeEco || 0) * 3
    + (e.incomeCoins || 0) * 3 + (card.id === 'grid' ? 6 : 0) - cost;
}

function botStep() {
  const player = currentPlayer();
  if (game.result || !player.bot) return;
  const level = game.botLevel, expert = level === 'hard', novice = level === 'easy';
  const ecoCostNow = player.district === 'residential' ? 1 : 2;
  const energy = player.resources[ENERGY], eco = player.resources[ECO];

  // Командные решения: новичок не платит, эксперт платит охотнее
  if (game.flags.flood === 'offered') return resolveFlood(teamCoins() >= (expert ? 4 : novice ? 99 : 5));
  if (game.flags.repair === 'offered' && teamCoins() >= (expert ? 6 : novice ? 99 : 8)) return payForRepair();

  game.mode = null;
  if (player.actionsLeft < 1) return endTurn();
  if (expert && game.flags.earthDay && !player.skippedForEarthDay && game.load >= 15) return skipActionForEarthDay();
  if (novice && Math.random() < 0.3) return sideJob();            // новичок иногда делает бесполезный ход

  // Опасная нагрузка: сначала спасаем город
  const danger = game.load >= (expert ? 22 : novice ? 38 : 30);
  if (danger && energy > 0) return sellEnergy(true);
  if (danger && eco >= ecoCostNow) return ecoAction();

  // Покупка лучшей карты из доступных (новичок берёт случайную)
  const options = [];
  game.market.forEach((card, i) => {
    const cost = cardCost(player, card);
    if (player.resources[COINS] >= cost && eco >= card.eco) options.push({ score: botCardScore(card, cost, expert), index: i });
  });
  if (options.length) {
    options.sort((a, b) => b.score - a.score);
    const pick = novice ? options[Math.floor(Math.random() * options.length)] : options[0];
    if (pick.score > 0 || novice) return buyCard(pick.index);
  }
  if (energy > 0 && game.load >= (expert ? 8 : novice ? 25 : 12)) return sellEnergy(true);
  if (eco >= ecoCostNow && game.load >= (expert ? 10 : novice ? 30 : 15)) return ecoAction();
  sideJob();
}

function renderEnd() {
  const texts = {
    win:  ['Победа! 🎉', 'Город выстоял и модернизирован.'],
    draw: ['Ничья', 'Город выжил, но стабильность ниже цели.'],
    lose: ['БЛЭКАУТ 💡', 'Нагрузка достигла 50 — проиграли все.'],
  }[game.result];
  const [green, yellow, red] = game.zoneMonths;
  app.innerHTML = `${banner(texts[0])}<div class="box">${texts[1]}<br>
    Стабильность: ${game.stability}% из ${game.goal}%. Месяц: ${game.month}.<br>
    ${partyReview()}<br>
    ${net.role === 'client' ? 'Ждите, пока хозяин начнёт новую партию.' : net.role === 'host' ? '<button class="main" onclick="backToLobby()">Играть снова</button>' : '<button class="main" onclick="renderMenu()">Играть снова</button>'}</div>
    <div class="box log">${game.log.map(esc).join('<br>')}</div>`;
}


// ---------- Сеть (PeerJS): хозяин хранит партию, клиенты шлют ему действия ----------
const net = { role: 'local', peer: null, conn: null, conns: [], code: '', me: null, lobby: null };
let myName = '';
try { myName = cleanName(localStorage.getItem('svetName')); } catch (e) { /* хранилище недоступно */ }

// Действия, которые клиент может попросить выполнить; всё остальное хозяин игнорирует
const ACTIONS = { buyCard, sellEnergy, ecoAction, sideJob, refreshMarket, startMode, giveResource,
                  exchangeResources, finishMode, skipActionForEarthDay, payForRepair, resolveFlood, endTurn };
const TEAM_ACTIONS = ['payForRepair', 'resolveFlood'];   // решает любой посаженный игрок, не только тот, чей ход

function cleanName(s) { return String(s || '').replace(/[<>&"'`\\]/g, '').trim().slice(0, 16); }
const myPid = () => net.role === 'client' ? net.peer.id : 'host';
const send = (conn, message) => { if (conn && conn.open) conn.send(JSON.stringify(message)); };
const sendAll = message => net.conns.forEach(conn => send(conn, message));
const parse = raw => { try { return JSON.parse(raw); } catch (e) { return null; } };
const districtOf = pid => net.lobby && Object.keys(DISTRICTS).find(id => net.lobby.seats[id].pid === pid) || null;

// Клиентам не отправляем колоды: нельзя подсмотреть будущие карты и события
function stateMessage() {
  const { cardDeck, discard, eventDeck, ...visible } = game;
  return { type: 'state', game: visible };
}
const lobbyMessage = () => ({ type: 'lobby', lobby: net.lobby });

function isMyTurn(player) {
  if (player.bot) return false;
  return net.role === 'local' || player.district === net.me;
}

// ---------- Выполнение действий ----------
function act(action, ...args) {
  if (net.role === 'client') return send(net.conn, { type: 'action', name: action.name, args });
  runAction(action.name, args, 'host');
}

const isSafeArg = arg => typeof arg === 'number' || typeof arg === 'boolean' || arg === 'help' || arg === 'swap';

// Единая проверка прав: и для хозяина, и для запросов клиентов
function runAction(name, args, pid) {
  if (!game || game.result || !ACTIONS[name] || !args.every(isSafeArg)) return;
  const player = currentPlayer(), isTeam = TEAM_ACTIONS.includes(name);
  const allowed = net.role === 'local' ? (isTeam || !player.bot)
    : isTeam ? game.players.some(p => p.pid === pid)
    : player.pid === pid && !player.bot;
  if (!allowed) return;
  try { ACTIONS[name](...args); } catch (e) { console.warn('Неверное действие', name, args, e); }
  render();
}

// ---------- Комната: хозяин ----------
function requirePeer() {
  if (typeof Peer !== 'undefined') return true;
  alert('Для игры по сети нужен интернет: библиотека PeerJS не загрузилась.');
  return false;
}

function saveName() {
  const input = document.getElementById('myname');
  if (input) myName = cleanName(input.value);
  try { localStorage.setItem('svetName', myName); } catch (e) { /* не страшно */ }
}

function leaveRoom() {
  clearTimeout(botTimer);
  if (net.peer) try { net.peer.destroy(); } catch (e) { /* уже закрыт */ }
  Object.assign(net, { role: 'local', peer: null, conn: null, conns: [], code: '', me: null, lobby: null });
  game = null;
  chatLog.length = 0; unread = 0;
  chatRender();
}

function backToMenu() { leaveRoom(); renderMenu(); }

function hostRoom() {
  saveName();
  if (!requirePeer()) return;
  leaveRoom();
  net.role = 'host';
  net.lobby = {
    seats: Object.fromEntries(Object.keys(DISTRICTS).map(id => [id, { status: 'bot' }])),
    difficulty: 'normal', botLevel: 'normal', tutorial: false,
  };
  app.innerHTML = `${banner('Комната')}<div class="box">Создаём комнату…</div>`;

  const code = Math.random().toString(36).slice(2, 7).toUpperCase();
  const peer = net.peer = new Peer('svet-' + code);
  peer.on('open', () => { net.code = code; chatRender(); renderLobby(); });
  peer.on('error', e => e.type === 'unavailable-id' ? hostRoom() : alert('Ошибка сети: ' + e.type));
  peer.on('connection', conn => {
    conn.on('open', () => { net.conns.push(conn); send(conn, game && !game.result ? stateMessage() : lobbyMessage()); });
    conn.on('data', raw => handleHostMessage(conn, parse(raw)));
    conn.on('close', () => dropConnection(conn));
  });
}

function handleHostMessage(conn, message) {
  if (!message) return;
  if (message.type === 'chat') return postChat(seatNameOf(conn.peer), message.text);
  if (message.type === 'claim') return claimSeat(message.district, conn.peer, message.name);
  if (message.type === 'action' && typeof message.name === 'string' && Array.isArray(message.args))
    runAction(message.name, message.args, conn.peer);
}

const seatNameOf = pid => {
  const seat = Object.values(net.lobby.seats).find(s => s.pid === pid);
  return seat ? seat.name : 'Зритель';
};

// Игрок вышел: его район переходит к роботу, партия продолжается
function dropConnection(conn) {
  net.conns = net.conns.filter(c => c !== conn);
  for (const seat of Object.values(net.lobby.seats))
    if (seat.pid === conn.peer) { seat.status = 'bot'; delete seat.pid; delete seat.name; }
  if (game && !game.result) {
    game.players.filter(p => p.pid === conn.peer).forEach(p => {
      p.bot = true;
      p.name = '🤖 ' + DISTRICTS[p.district].name;
      log(`${p.name}: игрок вышел, район у робота`);
    });
    render();
  } else lobbyBroadcast();
}

// ---------- Лобби ----------
function lobbyBroadcast() { sendAll(lobbyMessage()); renderLobby(); }

function claimSeat(district, pid, name) {
  const seats = net.lobby.seats, seat = seats[district];
  if ((game && !game.result) || !seat || seat.status === 'closed') return;
  const release = s => { s.status = 'bot'; delete s.pid; delete s.name; };
  if (seat.status === 'human' && seat.pid === pid) release(seat);                  // повторный клик — освободить
  else if (seat.status === 'bot') {
    Object.values(seats).forEach(s => { if (s.pid === pid) release(s); });         // у игрока только один район
    Object.assign(seat, { status: 'human', pid, name: cleanName(name) || 'Игрок' });
  }
  net.me = districtOf(myPid());
  lobbyBroadcast();
}

const claim = district => net.role === 'client'
  ? send(net.conn, { type: 'claim', district, name: myName })
  : claimSeat(district, 'host', myName);

function toggleSeat(district) {
  const seat = net.lobby.seats[district];
  if (seat.status === 'human') return;
  seat.status = seat.status === 'bot' ? 'closed' : 'bot';
  lobbyBroadcast();
}

function setLobbyOption(key, value) { net.lobby[key] = value; lobbyBroadcast(); }
function copyLink() { if (navigator.clipboard) navigator.clipboard.writeText(location.href.split('#')[0] + '#' + net.code); }

function renderLobby() {
  const { seats } = net.lobby, host = net.role === 'host', ids = Object.keys(DISTRICTS);
  const activeSeats = ids.filter(id => seats[id].status !== 'closed').length;
  const hasHuman = ids.some(id => seats[id].status === 'human');
  const select = (key, options) => `<select onchange="setLobbyOption('${key}',this.value)">${Object.entries(options).map(([value, label]) =>
    `<option value="${value}" ${net.lobby[key] === value ? 'selected' : ''}>${label}</option>`).join('')}</select>`;

  const seatCards = ids.map(id => {
    const seat = seats[id], isMe = seat.pid && seat.pid === myPid();
    const label = seat.status === 'human' ? `👤 ${esc(seat.name)}${isMe ? ' (вы)' : ''}` : seat.status === 'bot' ? '🤖 Робот' : '✖ Не играет';
    return `<div class="seat"><div onclick="claim('${id}')" style="cursor:pointer;opacity:${seat.status === 'closed' ? 0.35 : 1}">
      ${img(D.IMG.districts[id], 'seatimg')}${DISTRICTS[id].name}<br><b>${label}</b></div>
      ${host && seat.status !== 'human' ? `<button onclick="toggleSeat('${id}')">${seat.status === 'bot' ? 'Закрыть' : 'Робот'}</button>` : ''}</div>`;
  }).join('');

  app.innerHTML = `${banner('Комната')}
  <div class="box">Код комнаты: <b style="font-size:22px;letter-spacing:3px">${net.code || '…'}</b>
    ${host ? '<button onclick="copyLink()">📋 Копировать ссылку</button>' : ''}<br>
    <small>Нажмите на район, чтобы занять его. Свободные районы займут роботы.</small></div>
  <div class="seats">${seatCards}</div>
  <div class="box">${host ? `Сложность: ${select('difficulty', DIFFICULTIES)}<br><small>${DIFFICULTIES[net.lobby.difficulty]}</small><br>
    <label><input type="checkbox" ${net.lobby.tutorial ? 'checked' : ''} onchange="setLobbyOption('tutorial',this.checked)"> 🎓 Обучающий режим</label><br>
    Роботы: ${select('botLevel', BOT_LEVELS)}<br>
    <button class="main" ${activeSeats < 2 || !hasHuman ? 'disabled' : ''} onclick="startNetworkGame()">Начать игру (районов: ${activeSeats})</button>`
    : 'Ждём, пока хозяин начнёт игру…'} <button onclick="backToMenu()">← Выйти</button></div>`;
}

function startNetworkGame() {
  const { seats, difficulty, botLevel, tutorial } = net.lobby;
  const players = Object.keys(DISTRICTS).filter(id => seats[id].status !== 'closed').map(id => seats[id].status === 'human'
    ? { district: id, name: '👤 ' + seats[id].name, pid: seats[id].pid }
    : { district: id, bot: true, name: '🤖 ' + DISTRICTS[id].name });
  startGame(players, { difficulty, botLevel, tutorial });
  render();
}

function backToLobby() {                       // после партии хозяин возвращает всех в лобби
  game = null;
  lobbyBroadcast();
}

// ---------- Комната: клиент ----------
function joinRoom(code) {
  code = (code || '').trim().toUpperCase();
  if (!code || !requirePeer()) return;
  saveName();
  leaveRoom();
  Object.assign(net, { role: 'client', code });
  app.innerHTML = `${banner('Комната')}<div class="box">Подключаемся к комнате ${esc(code)}…</div>`;

  const peer = net.peer = new Peer();
  peer.on('open', () => {
    const conn = net.conn = peer.connect('svet-' + code, { reliable: true });
    conn.on('data', raw => handleClientMessage(parse(raw)));
    conn.on('close', () => { alert('Связь с хозяином комнаты потеряна.'); backToMenu(); });
  });
  peer.on('error', e => {
    alert(e.type === 'peer-unavailable' ? 'Комната не найдена. Проверьте код.' : 'Ошибка сети: ' + e.type);
    backToMenu();
  });
}

function handleClientMessage(message) {
  if (!message) return;
  if (message.type === 'lobby') {
    net.lobby = message.lobby;
    net.me = districtOf(myPid());
    if (!game || game.result) { game = null; renderLobby(); }
  } else if (message.type === 'state') { game = message.game; chatRender(); render(); }
  else if (message.type === 'chat') addChat(message);
}

// ---------- Чат ----------
const chatLog = [], QUICK_PHRASES = ['Помоги мне', 'Подай энергию!', 'Куплю карту', 'Спасибо', 'Готов'];
let chatOpen = false, unread = 0;
const cleanText = s => String(s || '').replace(/[<>&"'`\\]/g, '').trim().slice(0, 80);
const $ = id => document.getElementById(id);

function chatRender() {
  $('chat').hidden = net.role === 'local';
  $('chatList').innerHTML = chatLog.slice(-40).map(m => `<div><b>${esc(m.name)}:</b> ${esc(m.text)}</div>`).join('');
  $('chatList').scrollTop = $('chatList').scrollHeight;
  $('chatBtn').textContent = '💬' + (unread ? ' ' + unread : '');
}

function addChat(message) {
  const name = cleanName(message.name) || 'Игрок', text = cleanText(message.text);
  if (!text) return;
  chatLog.push({ name, text });
  if (!chatOpen) unread++;
  chatRender();
}

function postChat(name, text) {                // только хозяин: добавить у себя и разослать всем
  text = cleanText(text);
  if (!text) return;
  const message = { type: 'chat', name, text };
  addChat(message);
  sendAll(message);
}

function chatSend(text) {
  text = cleanText(text);
  if (!text) return;
  if (net.role === 'client') send(net.conn, { type: 'chat', text });
  else postChat((net.me && net.lobby.seats[net.me].name) || myName || 'Хозяин', text);
}

function toggleChat() {
  chatOpen = !chatOpen; unread = 0;
  $('chatPanel').hidden = !chatOpen;
  chatRender();
}

// ---------- Вход в сеть из главного меню ----------
const networkBox = () => `<div class="box"><h2>Игра по сети</h2>
  Ваше имя: <input id="myname" maxlength="16" value="${esc(myName)}" placeholder="Имя"><br>
  <button class="main" onclick="hostRoom()">🌐 Создать комнату</button><br>
  Код комнаты: <input id="joinCode" maxlength="8" value="${esc(location.hash.slice(1))}" style="text-transform:uppercase;width:110px">
  <button class="main" onclick="joinRoom($('joinCode').value)">Войти</button></div>`;

$('chatQuick').innerHTML = QUICK_PHRASES.map((text, i) => `<button onclick="chatSend(QUICK_PHRASES[${i}])">${text}</button>`).join('');
renderMenu();
</script></body></html>
